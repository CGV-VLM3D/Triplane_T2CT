# Tier-1 toy: TriVAE_D3T (Swin-based) at 2mm latent, width-1/2.
#
# D3T standard (Tier 2/3): emb_dim=256, n_swin_enc_layers=4, swin_window_size=[5,5,4].
# This Tier-1 halves emb_dim only; depth and window stay the same (μP).
# patch_size=4 is locked for the 24 GB 1mm-inference budget.
#
# 2mm patch grid: (60/4, 60/4, 32/4) = (15, 15, 8). swin_window_size [5,5,4]
# divides cleanly: 3x3x2 windows per plane.

exp_name: trial_toy_d3t

data:
  root: /workspace/data/latents_2mm

model:
  kind: TriVAE_D3T
  in_channels: 4
  emb_dim: 128                 # half of D3T standard (256)
  patch_size: 4                # LOCKED for 24 GB budget
  n_swin_enc_layers: 4         # same as D3T standard (depth μP-fragile)
  swin_window_size: [5, 5, 4]
  swin_num_heads: 8
  n_fpsi_layers: 2
  fpsi_num_heads: 8
  out_channels: 8              # D3T natural bottleneck (per Karpathy per-arch best)
  n_swin_dec_layers: 4
  latent_shape: [60, 60, 32]

loss:
  l1_weight: 1.0

train:
  epochs: 100
  batch_size: 4                # TBD: will sanity-test before launch
  lr: 1.0e-4
  log_every: 25
  amp: bf16
  resume: auto
  save_every_n_steps: 500
  max_wall_minutes: 60

eval:
  fast_n_samples: 100
  image_metric_n_samples: 0
  image_metric_every_n_epochs: 0
  val_split: valid
  sw_batch_size: 64
  compile_maisi: false

wandb:
  project: triplane-ae
  run_name: trial_toy_d3t

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
