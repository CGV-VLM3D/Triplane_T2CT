exp_name: trial_toy_compress3d_attn

data:
  root: /workspace/data/latents_2mm

model:
  kind: TriplaneAE
  encoder:
    in_channels: 4
    latent_shape: [60, 60, 32]
    plane_channels: 16
    latent_channels: 16
    n_resblocks: [2, 2, 4]
    downsampling: false
    use_cross_attn: true
    cross_attn_heads: 4
    cross_attn_d_kv: 16
    cross_attn_window: 1
  decoder:
    n_tri_resblocks: 3

loss:
  l1_weight: 1.0
  l2_weight: 0.0
  kl_weight: 1.0e-6

train:
  epochs: 50
  batch_size: 4
  lr: 1.0e-4
  log_every: 25
  resume: auto
  save_every_n_steps: 500
  max_wall_minutes: 60

eval:
  fast_n_samples: 100
  image_metric_n_samples: 0
  image_metric_every_n_epochs: 0
  val_split: valid
  sw_batch_size: 64
  compile_maisi: false

wandb:
  project: triplane-ae
  run_name: trial_toy_compress3d_attn

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
