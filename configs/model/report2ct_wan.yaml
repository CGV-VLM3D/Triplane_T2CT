# Wan2.1-latent variant of configs/model/report2ct.yaml (the REAL report2ct 2560-d
# findings+impression conditioning — NOT the CLIP3D-768 twin). Changes vs report2ct.yaml:
#   - in_channels / out_channels 4 → 16 (Wan2.1 latent has 16 channels vs MAISI's 4)
#   - lr 1e-4 → 2e-4 (sqrt scaling for batch 2 → 8; scale_factor auto-normalizes latent std≈1 so
#     the gradient scale matches MAISI and the LR transfers)
#   - warmup_steps 0 → 500 (linear LR warmup; report2ct baseline keeps 0)
# cross_attention_dim 2560, RFlow scheduler, attention levels, class embeds, spacing input all
# identical to report2ct.yaml. Trained from scratch on the Wan2.1 latent substrate — report2ct
# with only the VAE latent swapped MAISI → Wan2.1. See docs/wan_latent_runbook.md.

_target_: src.models.report2ct_module.Report2CTModule

# Training hyperparameters — source: config_maisi_diff_model_vlm3D.json:30-33
lr: 2e-4                 # sqrt scale for batch 8 (report2ct baseline is 1e-4 @ batch 2)
cfg_drop_prob: 0.15      # report2ct regime (whole-batch default); experiment sets cfg_per_sample=true
spacing_scale: 1.0       # spacing already ×100 in DataModule (upstream :88)
modality_class_label: 1  # CT modality — upstream :270
lr_scheduler_power: 2.0  # upstream PolynomialLR :200
warmup_steps: 500        # linear LR warmup before PolynomialLR (report2ct baseline keeps 0)

# UNet — source: config_maisi_2560.json:diffusion_unet_def (channels adapted for Wan latent)
unet:
  _target_: monai.apps.generation.maisi.networks.diffusion_model_unet_maisi.DiffusionModelUNetMaisi
  spatial_dims: 3
  in_channels: 16          # Wan2.1 latent channels (was 4 for MAISI/text2ct)
  out_channels: 16
  num_channels: [64, 128, 256, 512]
  num_res_blocks: 2
  attention_levels: [false, false, true, true]
  num_head_channels: [0, 0, 32, 32]
  cross_attention_dim: 2560  # report2ct findings+impression context (B, 2, 2560)
  num_class_embeds: 128
  include_fc: true
  include_spacing_input: true
  include_top_region_index_input: false  # include_body_region: false (:102)
  include_bottom_region_index_input: false
  resblock_updown: true
  with_conditioning: true
  use_flash_attention: true

# Noise scheduler — source: config_maisi_2560.json:noise_scheduler
noise_scheduler:
  _target_: src.baselines.rflow.RFlowScheduler
  num_train_timesteps: 1000
  scale: 1.4
  use_timestep_transform: true
  use_discrete_timesteps: false
  sample_method: uniform
