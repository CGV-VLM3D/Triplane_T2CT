# Standard ours v1.0 (Tier-2/3 full width). Designed so 1mm full-resolution
# inference fits under 24 GB VRAM. For Tier-1 toy width, override emb_dim and
# decoder.hidden in the launch yaml (Path A: width 1/2).
kind: TriplaneAE
encoder:
  in_channels: 4
  emb_dim: 512
  n_layers: 6
  n_heads: 8
  out_channels: 24
  patch_size: 4
  latent_shape: [120, 120, 64]
decoder:
  in_channels: 24
  hidden: 96
  out_channels: 4
  patch_size: 4
  latent_shape: [120, 120, 64]
  n_res_blocks: 4
