# @package _global_.model
# Self-trained Text2CT UNet (from-scratch on ctrate_toy_v2 5k, 200ep — logs/text2ct_train_20260625_081602.log).
# Same pipeline as the released baseline (text2ct.yaml); only the UNet weights differ.
# Namespaced run dir (outputs/text2ct_toy_v2/) keeps it distinct from the author baseline's eval.
name: text2ct_toy_v2

_target_: src.eval.samplers.text2ct.Text2CTSampler

ckpt_dir: /workspace/data/checkpoints/text2ct
unet_filename: unet_rflow_200ep_toy_v2.pt   # our trained UNet; scale_factor read from the ckpt (1.0200939)
n_steps: 30                       # upstream config_diff_model.json (num_inference_steps)
guidance_scale: 5.0               # upstream environment_diff_model_eval.json
output_spacing_mm: [0.75, 0.75, 3.0]   # Text2CT native output spacing
