# @package _global_.model
# Eval for report2ct_text2ct_mask_g4: same as report2ct_text2ct_mask eval, but mask_dir points at
# the 4-organ-group (num_classes=5) valid masks. The sampler infers num_classes from the ckpt's
# embedding table, so ONLY mask_dir + name differ from the full-118 eval config.
name: report2ct_text2ct_mask_g4

_target_: src.eval.samplers.report2ct_text2ct_mask.Report2CTText2CTMaskSampler

# Must be provided on the CLI:
#   model.ckpt_path=/workspace/outputs/report2ct_text2ct_mask_g4/<KST-date>[_N]/checkpoints/epoch_199.ckpt
ckpt_path: ???

# Precomputed FrozenCLIP3D cond embeddings (<scan_id>.pt, each (1, 768)) — collapsed scan-id keyed.
cond_dir: /workspace/data/text2ct_clip3d/cond_embeddings/valid

# Precomputed top-K 4-organ-group valid masks (<vol>.pt) from
# scripts/precompute_mask_latentgrid.py --split valid_fixed --group-organs --k 4.
mask_dir: /workspace/data/text2ct_mask_g4/valid

# RFlow denoising steps — matches text2ct_100ep_toy_v2 eval (30).
n_steps: 30

modality_class_label: 1   # CT class (matches training config)

# text2ct native spacing (its 512×512×128 output), matching how this model was trained.
spacing_mm: ???  # REQUIRED on CLI, no default (model.spacing_mm=[0.75,0.75,3.0]); recommended 0.75 0.75 3.0 (text2ct native, see above)

# Classifier-free guidance scale (text-only CFG; mask is always present). Matches text2ct eval.
cfg_scale: ???  # REQUIRED on CLI, no default (model.cfg_scale=5.0); recommended 5.0 (see above)
