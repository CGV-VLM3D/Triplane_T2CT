# @package _global_.task
name: ctgen

# Number of CT-RATE validation cases to evaluate (null = all ~1304)
n_samples: 100

# GT mode: valid = CT-RATE valid_fixed as ground-truth; official = pre-extracted docker GT
gt_mode: valid   # choices: valid | official

# Shared valid-GT cache. Used in BOTH modes by run_eval.py (gt_dir or out_dir/gt).
# In valid mode, prepare_valid_gt() is idempotent: existing .mha are reused (no re-convert),
# so all models share one byte-identical GT set for a fair win_condition comparison.
# Set = frozen representative valid_v2: valid_fixed one-scan-per-patient = 1304
# (ctrate_toy_v2/valid_v2/ids.json). load_eval_cases() restricts to it; any n_samples<1304
# is a seeded-shuffle NESTED subset (representative, identical across models).
# (Legacy _shared_gt_1000 was the head-1000 / 425-patient set — superseded.)
gt_dir: /workspace/data/vlm3d_eval/_valid_v2_1304

# XLSX with text prompts (for CLIPScore text-image alignment).
# When null in valid mode, CLIPScore I2T is skipped; only I2I is computed.
prompt_xlsx: null

metrics:
  fvd: true
  clip_score: true      # requires CT-CLIP_v2.pt
  fid_2p5d: true

# Paths to evaluation scripts and model weights.
# NOTE: vlm3d_eval_dir is documentary only — CTGenEvaluator resolves the eval dir
# itself via src/eval/_vlm3d_paths.py (ct_challenges/ layout, a945900+).
vlm3d_eval_dir: /workspace/third_party/vlm3d_dockers/ct_challenges/ctgen_evaluation
ctclip_ckpt: /workspace/data/vlm3d_eval/models/CT-CLIP_v2.pt
