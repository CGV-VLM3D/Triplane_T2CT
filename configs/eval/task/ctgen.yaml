# @package _global_.task
name: ctgen

# Number of CT-RATE validation cases to evaluate (null = all ~1304)
n_samples: 100

# GT mode: proxy = CT-RATE valid_fixed as ground-truth; official = pre-extracted docker GT
gt_mode: proxy   # choices: proxy | official

# Shared proxy-GT cache. Used in BOTH modes by run_eval.py (gt_dir or out_dir/proxy_gt).
# In proxy mode, prepare_proxy_gt() is idempotent: existing .mha are reused (no re-convert),
# so all models share one byte-identical GT set for a fair win_condition comparison.
# Built once on the valid_1000 split (2026-06-03); also serves any n_samples<=1000 head subset.
gt_dir: /workspace/data/vlm3d_eval/_shared_gt_1000

# XLSX with text prompts (for CLIPScore text-image alignment).
# When null in proxy mode, CLIPScore I2T is skipped; only I2I is computed.
prompt_xlsx: null

metrics:
  fvd: true
  clip_score: true      # requires CT-CLIP_v2.pt
  fid_2p5d: true

# Paths to evaluation scripts and model weights
vlm3d_eval_dir: /workspace/third_party/vlm3d_dockers/ctgen_evaluation
ctclip_ckpt: /workspace/data/vlm3d_eval/models/CT-CLIP_v2.pt
