# Trial-2: earlier baseline (emb_dim=256, n_layers=4, out_channels=8) on 1mm
# latents. Used as the default config_name in scripts/train.py.

defaults:
  - data: latents_1mm
  - model: triplane_ae_trial2
  - train: trial2
  - eval: full
  - loss: l1
  - wb: default
  - _self_

exp_name: trial2

eval:
  sw_batch_size: 16   # legacy default for this run; modern A6000 Pro uses 64

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
