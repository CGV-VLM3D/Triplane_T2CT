# Wan2.1-latent + report2ct-2560 + per-encoder text TOKEN SEQUENCE datamodule (Phase 1b).
# Same as configs/data/report2ct_wan.yaml (identical image/spacing/pooled-context loading) PLUS
# the 3 text encoders' token sequences (not just their mean-pooled vector) via the
# `<id>_emb.nii.gzmulti_2560_ctx.npz` sidecar — see src/data/report2ct_wan_seq_datamodule.py and
# docs/vlm3d_research_roadmap.md Phase 1a/1b. Reuses the SAME datalist as report2ct_wan.yaml
# unmodified — the npz path is derived from the existing `context_f` entry, no new datalist key.
_target_: src.data.report2ct_wan_seq_datamodule.Report2CTSeqDataModule

datalist_path: /workspace/data/report2ct_wan/datalist_wan_2560.json
batch_size: 8          # Wan latent spatial grid (64×64×64) ~3.5× smaller than MAISI (120×120×64)
num_workers: 32        # upstream diff_model_train_vlm3D_2560_multi_text.py:111
cache_rate: 0.0        # upstream config_maisi_diff_model_vlm3D.json:31
spacing_multiplier: 100.0  # upstream :88 — spacing × 1e2
