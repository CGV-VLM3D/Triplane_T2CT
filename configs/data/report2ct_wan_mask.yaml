# Wan2.1-latent + report2ct-2560 + Wan mask-latent datamodule. Same as configs/data/report2ct_wan.yaml
# but the datalist ALSO carries a per-scan `mask_latent` path (frozen-Wan encode of the painted 4-organ
# GT mask), and the datamodule loads it into the batch so Report2CTModule concatenates it at the UNet
# input. The 2560 text context + varied per-scan spacing are unchanged (latent-agnostic).
#
# datalist built by scripts/build_report2ct_datalist.py --mask-dir <mask latents dir>
#   (--image-dir data/report2ct_wan/latents_512x512x253
#    --mask-dir  data/report2ct_wan/mask_latents_512x512x253) — see docs/wan_latent_runbook.md.
_target_: src.data.report2ct_wan_mask_datamodule.Report2CTWanMaskDataModule

datalist_path: /workspace/data/report2ct_wan/datalist_wan_mask_2560.json
batch_size: 8          # Wan latent spatial grid (64×64×64) ~3.5× smaller than MAISI (120×120×64)
num_workers: 32        # upstream diff_model_train_vlm3D_2560_multi_text.py:111
cache_rate: 0.0        # upstream config_maisi_diff_model_vlm3D.json:31
spacing_multiplier: 100.0  # upstream :88 — spacing × 1e2
