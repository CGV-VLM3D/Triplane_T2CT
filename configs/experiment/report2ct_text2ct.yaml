# @package _global_
# text2ct-VAE latent + CLIP3D (768) conditioner, NO mask (CONTROL arm of the A/B).
# Reuses the clip3d model (Report2CTModule, UNet in=4/out=4/xattn=768) trained on text2ct latents,
# so it is the matched mask-off twin of report2ct_text2ct_mask. Uses the SAME text2ct_mask data
# pipeline (the mask keys in each batch are simply ignored by the mask-off model).
# Launch: CUDA_VISIBLE_DEVICES=1 python src/train.py experiment=report2ct_text2ct

defaults:
  - override /data: text2ct_mask
  - override /model: report2ct_clip3d     # in=4, out=4, cross_attention_dim=768, no mask_conditioner
  - override /trainer: report2ct
  - override /callbacks: default
  - override /logger: wandb
  - _self_

task_name: report2ct_text2ct   # → outputs/report2ct_text2ct/<KST-date>[_N]/
tags: ["text2ct_latent", "baseline", "ctgen"]
seed: 42

logger:
  wandb:
    group: "text2ct-baseline"
test: false

# text2ct training regime: 200 epochs, CFG dropout 0.1 (report2ct_clip3d model defaults to 0.15).
trainer:
  max_epochs: 200
model:
  cfg_drop_prob: 0.1
  cfg_per_sample: true   # per-sample CFG drop (text2ct convention), matches the mask arm

callbacks:
  early_stopping: null
  model_checkpoint:
    monitor: null
    every_n_epochs: 10
    save_top_k: -1
    save_last: true
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: false
  rich_progress_bar: null
