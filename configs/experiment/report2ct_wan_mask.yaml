# @package _global_
# Mask-conditioned Wan2.1-latent ctgen experiment (TREATMENT arm). Identical to report2ct_wan
# (real report2ct 2560-d cond + RFlow + varied per-scan spacing, Wan2.1 latent) PLUS a frozen-Wan
# mask latent concatenated at the UNet input (in_channels 16→32). GT-mask conditioned; the A/B
# head-to-head is the plain report2ct_wan run.
# Launch (GPU 1):
#   CUDA_VISIBLE_DEVICES=1 python src/train.py experiment=report2ct_wan_mask
# Smoke:
#   CUDA_VISIBLE_DEVICES=1 python src/train.py experiment=report2ct_wan_mask \
#       trainer.max_epochs=1 trainer.limit_train_batches=50

defaults:
  - override /data: report2ct_wan_mask
  - override /model: report2ct_wan_mask   # in=32 (16 img + 16 mask), out=16, no mask_conditioner
  - override /trainer: report2ct
  - override /callbacks: default
  - override /logger: wandb
  - _self_

task_name: report2ct_wan_mask   # → outputs/report2ct_wan_mask/<KST-date>[_N]/
tags: ["wan_latent", "mask_cond", "ctgen"]
seed: 42

logger:
  wandb:
    group: "wan-latent-mask"
test: false

# Same regime as report2ct_wan: cfg_drop_prob 0.15 per-sample (TEXT only — mask always present),
# no grad-clip (grad-norm logged), 300 epochs (Wan @ batch 8 is step-starved at 100). Stop on FID plateau.
trainer:
  max_epochs: 300
model:
  cfg_per_sample: true   # per-sample TEXT CFG drop (drop prob stays 0.15 from model cfg)

callbacks:
  early_stopping: null
  model_checkpoint:
    monitor: null
    every_n_epochs: 10
    save_top_k: -1
    save_last: true
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: false
  rich_progress_bar: null
