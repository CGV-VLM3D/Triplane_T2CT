# Tier-1 toy: Compress3D innovations (feature lift + deep K/V + 3D-aware
# cross-attn) WITHOUT extra triplane compression. Latent stays at high-res
# (matches v2's spatial layout) — MAISI already gives 16× compression, no
# point in adding another 16× on top for our reconstruction task.

defaults:
  - data: latents_2mm
  - model: triplane_ae_compress3d
  - train: tier1
  - eval: latent_only
  - loss: l1
  - wb: default
  - _self_

exp_name: trial_toy_compress3d_hires

model:
  encoder:
    latent_shape: [60, 60, 32]
    n_triplane_downsamples: 0   # no triplane spatial compression
    volume_downsample: 1        # no volume compression either (m=1 cube → column attn over deep K/V)

loss:
  kl_weight: 1.0e-6

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
