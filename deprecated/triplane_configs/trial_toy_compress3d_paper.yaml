# Tier-1 toy: paper-faithful Compress3D TriplaneAE on 2mm latents.
# Compare against trial_toy_compress3d_attn_v2 (simplified one-shot collapse).

defaults:
  - data: latents_2mm
  - model: triplane_ae_compress3d
  - train: tier1
  - eval: latent_only
  - loss: l1
  - wb: default
  - _self_

exp_name: trial_toy_compress3d_paper

model:
  encoder:
    latent_shape: [60, 60, 32]

loss:
  kl_weight: 1.0e-6

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
