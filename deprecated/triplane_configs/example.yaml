# =============================================================================
# Annotated example launch config for the triplane autoencoder.
#
# This file shows the Hydra group composition pattern used across configs/.
# To create a new experiment:
#   1. Copy this file to configs/<your_exp>.yaml
#   2. Edit the `defaults:` list to pick a model / data / train / eval recipe
#   3. Set `exp_name` and add overrides under model/train/eval as needed
#
# Launch:
#   python scripts/train.py --config-name=<your_exp>
#   # or with CLI overrides:
#   python scripts/train.py --config-name=<your_exp> train.lr=2e-4 train.epochs=20
#
# Group files live in:
#   configs/model/{triplane_ae,triplane_ae_trial2,trivqae_conv,trivae_d3t}.yaml
#   configs/data/{latents_1mm,latents_2mm}.yaml
#   configs/train/{tier1,tier2,trial2}.yaml
#   configs/eval/{full,latent_only}.yaml
#   configs/loss/l1.yaml
#   configs/wb/default.yaml
# =============================================================================

defaults:
  # Pick one yaml from each group. Anything you don't override below comes from
  # these group files.
  - data: latents_1mm
  - model: triplane_ae
  - train: tier2
  - eval: full
  - loss: l1
  - wb: default
  - _self_      # `_self_` LAST so this file's keys win over the group defaults.

exp_name: example

# ---------------------------------------------------------------------------
# Per-experiment deltas. Anything you list here overrides the group files.
# ---------------------------------------------------------------------------

# Example: width-halve the standard ours v1.0 model for a Tier-1 toy run.
# model:
#   encoder:
#     emb_dim: 256
#     latent_shape: [60, 60, 32]
#   decoder:
#     hidden: 48
#     latent_shape: [60, 60, 32]

# Example: shorter wall-clock + larger batch for a smoke test.
# train:
#   epochs: 5
#   batch_size: 4
#   max_wall_minutes: 10

# Example: skip image-domain metrics (no ct_recon cache needed).
# eval:
#   image_metric_n_samples: 0
#   image_metric_every_n_epochs: 0

# Optional: decouple wandb run_name from exp_name (defaults to ${exp_name}).
# wandb:
#   run_name: example_lr2e-4

# ---------------------------------------------------------------------------
# Hydra: per-run working directory for resolved-config dumps. Almost never
# needs touching.
# ---------------------------------------------------------------------------
hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
