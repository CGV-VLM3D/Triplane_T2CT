# Trial D3T: TriVAE_D3T at the full 1mm latent, 50-epoch original schedule.

defaults:
  - data: latents_1mm
  - model: trivae_d3t
  - train: trial2
  - eval: full
  - loss: l1
  - wb: default
  - _self_

exp_name: trial_d3t

eval:
  sw_batch_size: 16

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
