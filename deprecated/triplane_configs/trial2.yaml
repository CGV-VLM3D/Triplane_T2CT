# Trial-2: Compress3D TriplaneAE on 1mm latents, original 50-epoch schedule.
# (Previously this experiment used the old transformer-based "trial2-width" arch.
# With the new Compress3D TriplaneAE, it now runs the standard 1mm config.)

defaults:
  - data: latents_1mm
  - model: triplane_ae
  - train: trial2
  - eval: full
  - loss: l1
  - wb: default
  - _self_

exp_name: trial2

eval:
  sw_batch_size: 16

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
