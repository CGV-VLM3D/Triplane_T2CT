# Tier-2: Compress3D TriplaneAE with CrossAttention3D, 1mm latents.

defaults:
  - data: latents_1mm
  - model: triplane_ae
  - train: tier2
  - eval: full
  - loss: l1
  - wb: default
  - _self_

exp_name: trial_mid_compress3d_attn

train:
  batch_size: 4

eval:
  image_metric_every_n_epochs: 10

loss:
  kl_weight: 1.0e-6

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
