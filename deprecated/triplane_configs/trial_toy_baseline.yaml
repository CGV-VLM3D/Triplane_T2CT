# Tier-1 reference baseline: collaborator's TriVQAEConv at its full default
# channel schedule, on 2mm toy latents. Not width-halved — we want the real
# reference number to position our candidates against.

defaults:
  - data: latents_2mm
  - model: trivqae_conv
  - train: tier1
  - eval: latent_only
  - loss: l1
  - wb: default
  - _self_

exp_name: trial_toy_baseline

model:
  encoder:
    latent_shape: [60, 60, 32]

# tier1 default batch_size=4 already matches the conv-heavy ~15.6 GB peak.

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
