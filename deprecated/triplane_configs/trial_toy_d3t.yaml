# Tier-1 toy: TriVAE_D3T (Swin-based) on 2mm latents, width-1/2.
# Standard D3T: emb_dim=256. Tier-1 halves emb_dim only; depth and window
# stay (μP).
# 2mm patch grid (60/4, 60/4, 32/4) = (15, 15, 8); swin_window_size [5,5,4]
# divides cleanly into 3×3×2 windows per plane.

defaults:
  - data: latents_2mm
  - model: trivae_d3t
  - train: tier1
  - eval: latent_only
  - loss: l1
  - wb: default
  - _self_

exp_name: trial_toy_d3t

model:
  emb_dim: 128
  latent_shape: [60, 60, 32]

train:
  epochs: 100
  amp: bf16

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
