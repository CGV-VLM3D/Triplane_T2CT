# Tier-1 toy: Compress3D TriplaneAE on 2mm latents.
# Same plane_channels/latent_channels as standard (16/16) — Tier-1 scope is
# architecture comparison within a 60-min wall-clock budget, not width scaling.

defaults:
  - data: latents_2mm
  - model: triplane_ae
  - train: tier1
  - eval: latent_only
  - loss: l1
  - wb: default
  - _self_

exp_name: trial_toy

model:
  encoder:
    latent_shape: [60, 60, 32]

train:
  batch_size: 8

hydra:
  run:
    dir: runs/${exp_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
