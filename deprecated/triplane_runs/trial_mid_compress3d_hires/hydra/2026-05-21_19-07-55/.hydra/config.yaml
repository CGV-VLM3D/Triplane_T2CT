data:
  root: /workspace/datasets/datasets/latents
model:
  kind: TriplaneAECompress3D
  encoder:
    in_channels: 4
    latent_shape:
    - 120
    - 120
    - 64
    feature_lift_channels: 32
    plane_channels_progression:
    - 32
    - 64
    - 128
    n_blocks_per_stage:
    - 2
    - 2
    - 4
    n_triplane_downsamples: 0
    volume_downsample: 1
    volume_kv_channels: null
    cross_attn_heads: 4
    cross_attn_d_kv: 32
    latent_channels: 32
  decoder:
    n_blocks_per_stage:
    - 3
    - 3
    - 5
train:
  epochs: 100
  batch_size: 2
  lr: 0.0001
  log_every: 50
  resume: auto
  save_every_n_steps: 500
  keep_last_n: 3
  max_wall_minutes: 360
eval:
  fast_n_samples: 200
  image_metric_n_samples: 50
  image_metric_every_n_epochs: 10
  val_split: valid
  sw_batch_size: 64
  compile_maisi: false
loss:
  l1_weight: 1.0
  l2_weight: 0.0
  kl_weight: 1.0e-06
wandb:
  project: triplane-ae
  run_name: ${exp_name}
exp_name: trial_mid_compress3d_hires
