exp_name: trial_toy
data:
  root: /workspace/data/latents_2mm
model:
  kind: TriplaneAE
  encoder:
    in_channels: 4
    emb_dim: 256
    n_layers: 4
    n_heads: 8
    out_channels: 8
    latent_shape:
    - 60
    - 60
    - 32
  decoder:
    in_channels: 8
    hidden: 16
    out_channels: 4
    latent_shape:
    - 60
    - 60
    - 32
loss:
  l1_weight: 1.0
train:
  epochs: 50
  batch_size: 1
  lr: 0.0001
  log_every: 25
  resume: auto
  save_every_n_steps: 500
  max_wall_minutes: 60
eval:
  fast_n_samples: 100
  image_metric_n_samples: 0
  image_metric_every_n_epochs: 0
  val_split: valid
  sw_batch_size: 64
  compile_maisi: false
wandb:
  project: triplane-ae
  run_name: trial_toy
