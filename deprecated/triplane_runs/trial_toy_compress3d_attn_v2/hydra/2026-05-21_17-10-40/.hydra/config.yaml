data:
  root: /workspace/data/latents_2mm
model:
  kind: TriplaneAE
  encoder:
    in_channels: 4
    latent_shape:
    - 60
    - 60
    - 32
    plane_channels: 32
    latent_channels: 32
    n_resblocks:
    - 2
    - 2
    - 4
    downsampling: false
    use_cross_attn: true
    cross_attn_heads: 4
    cross_attn_d_kv: 16
    cross_attn_window: 1
  decoder:
    n_tri_resblocks: 5
train:
  epochs: 50
  batch_size: 32
  lr: 0.0003
  log_every: 25
  resume: auto
  save_every_n_steps: 500
  keep_last_n: 3
  max_wall_minutes: 60
eval:
  fast_n_samples: 100
  image_metric_n_samples: 0
  image_metric_every_n_epochs: 0
  val_split: valid
  sw_batch_size: 64
  compile_maisi: false
loss:
  l1_weight: 1.0
  l2_weight: 0.0
  kl_weight: 1.0e-06
wandb:
  project: triplane-ae
  run_name: ${exp_name}
exp_name: trial_toy_compress3d_attn_v2
