exp_name: trial_toy_baseline
data:
  root: /workspace/data/latents_2mm
model:
  kind: TriVQAEConv
  encoder:
    in_channels: 4
    latent_shape:
    - 60
    - 60
    - 32
    encoder_channels:
    - 16
    - 32
    - 64
    - 64
    - 64
    - 64
    blocks_per_stage: 2
    plane_channels: 64
  decoder:
    out_channels: 4
    decoder_channels: null
    final_hidden_channels: 64
    final_depth: 2
loss:
  l1_weight: 1.0
train:
  epochs: 50
  batch_size: 4
  lr: 0.0001
  log_every: 25
  resume: auto
  save_every_n_steps: 500
  max_wall_minutes: 60
eval:
  fast_n_samples: 100
  image_metric_n_samples: 0
  image_metric_every_n_epochs: 0
  val_split: valid
  sw_batch_size: 64
  compile_maisi: false
wandb:
  project: triplane-ae
  run_name: trial_toy_baseline
